gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

server {
    listen 8080;
    server_name _;
    root /var/www/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy with buffering
    location /mca/ { proxy_pass http://127.0.0.1:8000; proxy_read_timeout 120s; proxy_buffering on; }
    location /sar/ { proxy_pass http://127.0.0.1:8000; proxy_read_timeout 120s; proxy_buffering on; }
    location /ml/ { proxy_pass http://127.0.0.1:8000; proxy_read_timeout 120s; proxy_buffering on; }
    location /indices/ { proxy_pass http://127.0.0.1:8000; proxy_read_timeout 120s; proxy_buffering on; }
    location /drought/ { proxy_pass http://127.0.0.1:8000; proxy_read_timeout 120s; proxy_buffering on; }
    location /hydrology/ { proxy_pass http://127.0.0.1:8000; proxy_read_timeout 120s; proxy_buffering on; }
    location /multiyear/ { proxy_pass http://127.0.0.1:8000; proxy_read_timeout 120s; proxy_buffering on; }
    location /forecast/ { proxy_pass http://127.0.0.1:8000; proxy_read_timeout 120s; proxy_buffering on; }
    location /projections/ { proxy_pass http://127.0.0.1:8000; proxy_read_timeout 120s; proxy_buffering on; }
    location /geocode { proxy_pass http://127.0.0.1:8000; proxy_read_timeout 120s; proxy_buffering on; }
    location /health { proxy_pass http://127.0.0.1:8000; }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
