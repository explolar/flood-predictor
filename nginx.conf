server {
    listen 8080;
    server_name _;
    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /mca/ { proxy_pass http://127.0.0.1:8000; proxy_read_timeout 120s; }
    location /sar/ { proxy_pass http://127.0.0.1:8000; proxy_read_timeout 120s; }
    location /ml/ { proxy_pass http://127.0.0.1:8000; proxy_read_timeout 120s; }
    location /indices/ { proxy_pass http://127.0.0.1:8000; proxy_read_timeout 120s; }
    location /drought/ { proxy_pass http://127.0.0.1:8000; proxy_read_timeout 120s; }
    location /hydrology/ { proxy_pass http://127.0.0.1:8000; proxy_read_timeout 120s; }
    location /multiyear/ { proxy_pass http://127.0.0.1:8000; proxy_read_timeout 120s; }
    location /forecast/ { proxy_pass http://127.0.0.1:8000; proxy_read_timeout 120s; }
    location /projections/ { proxy_pass http://127.0.0.1:8000; proxy_read_timeout 120s; }
    location /geocode { proxy_pass http://127.0.0.1:8000; proxy_read_timeout 120s; }
    location /health { proxy_pass http://127.0.0.1:8000; }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
